<div class="city-master-page">
  <!-- Page Header -->
  <div class="page-header-flex">
    <div>
      <h2 class="page-title">Testimonials Master</h2>
    </div>
    <div class="header-actions">
      <div class="search-input-wrapper">
        <input
          type="text"
          [(ngModel)]="searchQuery"
          (ngModelChange)="onSearch()"
          placeholder="Search client name or message..."
          class="premium-input table-search-input"
        />
        <span nz-icon nzType="search" nzTheme="outline" class="search-input-icon"></span>
      </div>
      <button class="btn-primary" (click)="openAddDrawer()">
        <span nz-icon nzType="plus" nzTheme="outline"></span>
        Add New Testimonial
      </button>
    </div>
  </div>

  <!-- Testimonials List -->
  <div class="table-card-wrapper">
    <div class="premium-table-container">
      <table class="premium-table">
        <thead>
          <tr>
            <!-- ACTION COLUMN FIRST -->
            <th style="width: 80px;" class="text-center">Edit</th>
            <th style="width: 90px;" class="text-center">Media</th>
            <th style="width: 200px;">Client Name</th>
            <th>Testimonial Message</th>
            <th style="width: 140px;" class="text-center">Status</th>
            <th style="width: 80px;" class="text-center">Action</th>
          </tr>
        </thead>
        <tbody>
          <!-- Loading state -->
          <tr *ngIf="loading && testimonials.length === 0">
            <td colspan="6" class="text-center empty-table-cell">
              <span nz-icon nzType="loading" style="font-size: 20px; color: #722F37;"></span>
              <div style="margin-top: 6px;">Loading Testimonials...</div>
            </td>
          </tr>

          <!-- Data Rows -->
          <tr *ngFor="let data of testimonials">
            <!-- Action Column First: Edit Button -->
            <td class="text-center">
              <button
                type="button"
                class="table-edit-btn"
                (click)="openEditDrawer(data)"
                title="Edit Testimonial"
              >
                <span nz-icon nzType="edit" nzTheme="outline"></span>
              </button>
            </td>

            <!-- Media / Photo -->
            <td class="text-center">
              <div class="avatar-cell-wrapper">
                <img
                  *ngIf="data.photo"
                  [src]="data.photo"
                  alt="Client Avatar"
                  class="client-avatar-img"
                />
                <div *ngIf="!data.photo" class="avatar-placeholder">
                  <span nz-icon nzType="user"></span>
                </div>
                <span *ngIf="data.video" class="video-indicator-badge" title="Video testimonial attached">
                  <span nz-icon nzType="video-camera"></span>
                </span>
              </div>
            </td>

            <!-- Client Name -->
            <td class="city-name-cell">
              {{ data.name }}
            </td>

            <!-- Testimonial Message -->
            <td class="state-cell">
              <div class="testimonial-message-clamp" [title]="data.message">
                "{{ data.message }}"
              </div>
            </td>

            <!-- Status Column: Switch Toggle -->
            <td class="text-center" (click)="$event.stopPropagation()">
              <nz-switch
                [ngModel]="data.isActive"
                (ngModelChange)="toggleStatus(data)"
                [nzCheckedChildren]="'Active'"
                [nzUnCheckedChildren]="'Inactive'"
              ></nz-switch>
            </td>

            <!-- Delete Action Column -->
            <td class="text-center" (click)="$event.stopPropagation()">
              <button
                type="button"
                class="status-inactive-btn"
                nz-popconfirm
                nzPopconfirmTitle="Are you sure you want to delete this Testimonial?"
                nzOkText="Delete"
                nzCancelText="Cancel"
                (nzOnConfirm)="deleteTestimonial(data.id)"
                title="Delete Testimonial"
                [disabled]="deletingId === data.id"
              >
                <span
                  nz-icon
                  [nzType]="deletingId === data.id ? 'loading' : 'delete'"
                  nzTheme="outline"
                ></span>
              </button>
            </td>
          </tr>

          <!-- Empty state -->
          <tr *ngIf="!loading && testimonials.length === 0">
            <td colspan="6" class="text-center empty-table-cell">
              <nz-empty nzNotFoundImage="simple" nzNotFoundContent="No Testimonials found"></nz-empty>
            </td>
          </tr>
        </tbody>
      </table>

      <!-- Pagination Footer -->
      <div class="table-pagination-footer" *ngIf="totalCount > 0">
        <div class="pagination-info">
          Showing {{ showingStart() }} to {{ showingEnd() }} of {{ totalCount }} testimonials
        </div>
        <div class="pagination-controls">
          <button
            type="button"
            class="btn-pagination"
            [disabled]="pageIndex === 1"
            (click)="prevPage()"
          >
            Previous
          </button>
          <span class="pagination-current-page">
            Page {{ pageIndex }} of {{ totalPages() }}
          </span>
          <button
            type="button"
            class="btn-pagination"
            [disabled]="pageIndex === totalPages()"
            (click)="nextPage()"
          >
            Next
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Testimonial Drawer -->
<nz-drawer
  *ngIf="drawerVisible"
  [nzVisible]="drawerVisible"
  nzPlacement="right"
  [nzWidth]="460"
  [nzTitle]="selectedTestimonial ? 'Edit Testimonial' : 'Add New Testimonial'"
  [nzClosable]="true"
  (nzOnClose)="closeDrawer()"
  class="city-drawer"
>
  <ng-container *nzDrawerContent>
    <app-add-testimonial
      [testimonialToEdit]="selectedTestimonial"
      (onSave)="handleSaveSuccess()"
      (onCancel)="closeDrawer()"
    ></app-add-testimonial>
  </ng-container>
</nz-drawer>
