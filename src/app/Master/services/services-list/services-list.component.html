<div class="faq-master-page">
  <!-- Page Header -->
  <div class="page-header-flex">
    <div>
      <h2 class="page-title">Services Master</h2>
    </div>
    <div class="header-actions">
      <div class="search-input-wrapper">
        <input type="text" [(ngModel)]="searchQuery" (ngModelChange)="onSearch()" placeholder="Search Services..."
          class="premium-input table-search-input" />
        <span nz-icon nzType="search" nzTheme="outline" class="search-input-icon"></span>
      </div>
      <button class="btn-primary" (click)="openAddDrawer()">
        <span nz-icon nzType="plus" nzTheme="outline"></span>
        Add New Service
      </button>
    </div>
  </div>

  <!-- Services List Table -->
  <div class="table-card-wrapper">
    <div class="premium-table-container">
      <table class="premium-table">
        <thead>
          <tr>
            <th style="width: 100px;">Action</th>
            <th class="sortable-header" (click)="toggleSort('title')">
              <span class="header-label-flex">
                Title
                <span class="sort-icon-container">
                  <span nz-icon nzType="caret-up"
                    [class.active-sort]="sortBy === 'title' && sortOrder === 'ASC'"></span>
                  <span nz-icon nzType="caret-down"
                    [class.active-sort]="sortBy === 'title' && sortOrder === 'DESC'"></span>
                </span>
              </span>
            </th>
            <th class="sortable-header" (click)="toggleSort('slug')">
              <span class="header-label-flex">
                Slug
                <span class="sort-icon-container">
                  <span nz-icon nzType="caret-up"
                    [class.active-sort]="sortBy === 'slug' && sortOrder === 'ASC'"></span>
                  <span nz-icon nzType="caret-down"
                    [class.active-sort]="sortBy === 'slug' && sortOrder === 'DESC'"></span>
                </span>
              </span>
            </th>
            <th class="sortable-header" (click)="toggleSort('displayOrder')" style="width: 130px;">
              <span class="header-label-flex">
                Sequence
                <span class="sort-icon-container">
                  <span nz-icon nzType="caret-up"
                    [class.active-sort]="sortBy === 'displayOrder' && sortOrder === 'ASC'"></span>
                  <span nz-icon nzType="caret-down"
                    [class.active-sort]="sortBy === 'displayOrder' && sortOrder === 'DESC'"></span>
                </span>
              </span>
            </th>
            <th style="width: 120px;" class="text-center">Status</th>
          </tr>
        </thead>
        <tbody>
          <tr *ngFor="let data of services; let i = index">
            <td>
              <div class="action-buttons-flex">
                <button type="button" class="table-edit-btn" (click)="openEditDrawer(data)" title="Edit Service">
                  <span nz-icon nzType="edit" nzTheme="outline"></span>
                </button>
              </div>
            </td>
            <td class="faq-question-cell" nz-tooltip [nzTooltipTitle]="data.title">
              <span style="font-weight: 500; color: var(--primary-burgundy);">{{ data.title }}</span>
            </td>
            <td>
              <span style="color: #666; font-size: 13px; font-family: monospace;">{{ data.slug }}</span>
            </td>
            <td>
              <div class="reorder-actions">
                <span class="order-number">{{ data.displayOrder }}</span>
              </div>
            </td>
            <td class="text-center">
              <nz-switch [(ngModel)]="data.isActive" (ngModelChange)="onStatusChange(data, $event)"
                [nzLoading]="data.statusLoading" nzCheckedChildren="On" nzUnCheckedChildren="Off">
              </nz-switch>
            </td>
          </tr>
          <tr *ngIf="services.length === 0">
            <td colspan="5" class="text-center empty-table-cell">
              <nz-empty nzNotFoundImage="simple"></nz-empty>
            </td>
          </tr>
        </tbody>
      </table>

      <!-- Pagination Footer -->
      <div class="table-pagination-footer" *ngIf="totalCount > 0">
        <div class="pagination-info">
          Showing {{ showingStart() }} to {{ showingEnd() }} of {{ totalCount }} Services
        </div>
        <div class="pagination-controls">
          <button type="button" class="btn-pagination" [disabled]="pageIndex === 1" (click)="prevPage()">
            Previous
          </button>
          <span class="pagination-current-page">
            Page {{ pageIndex }} of {{ totalPages() }}
          </span>
          <button type="button" class="btn-pagination" [disabled]="pageIndex === totalPages()" (click)="nextPage()">
            Next
          </button>
        </div>
      </div>
    </div>
  </div>
</div>

<!-- Add/Edit Drawer -->
<nz-drawer *ngIf="drawerVisible" [nzVisible]="drawerVisible" nzPlacement="right" [nzWidth]="'100vw'"
  [nzTitle]="selectedService ? 'Edit Service' : 'Add New Service'" [nzClosable]="true" (nzOnClose)="closeDrawer()"
  class="faq-drawer">
  <ng-container *nzDrawerContent>
    <app-add-service [serviceToEdit]="selectedService" [nextDisplayOrder]="nextDisplayOrder" (onSave)="handleSaveSuccess()" (onCancel)="closeDrawer()"></app-add-service>
  </ng-container>
</nz-drawer>
